global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: 'omniheaven-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:4000']
        labels:
          service: 'omniheaven-api'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
