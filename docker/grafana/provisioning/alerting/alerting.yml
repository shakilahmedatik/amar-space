apiVersion: 1

contactPoints:
  - orgId: 1
    name: OmniHeaven Alerts
    receivers:
      - uid: omniheaven-alerts-receiver
        type: webhook
        settings:
          url: http://api:4000/api/alerts/webhook

policies:
  - orgId: 1
    receiver: OmniHeaven Alerts
    group_by: ['alertname', 'service']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

