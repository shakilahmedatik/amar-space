services:
  # =========================================================================
  # 1. DATABASE: PostgreSQL 16
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: omniheaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniheaven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniheaven_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-omniheaven_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniheaven} -d ${POSTGRES_DB:-omniheaven_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniheaven-net

  # =========================================================================
  # 2. IN-MEMORY CACHE & RATE LIMITER: Valkey 8 (Redis-compatible, BSD-3)
  # =========================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: omniheaven-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniheaven-net

  # =========================================================================
  # 3. OBJECT STORAGE: SeaweedFS (S3-compatible, Apache 2.0)
  # =========================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: omniheaven-seaweedfs
    restart: unless-stopped
    command: "server -s3 -dir=/data -s3.port=8333 -s3.allowEmptyFolder=false"
    ports:
      - "8333:8333" # S3 Endpoint API
      - "9333:9333" # Master Status / Filer
    volumes:
      - seaweedfs_data:/data
    networks:
      - omniheaven-net

  # =========================================================================
  # 3. BACKEND API: Bun + Hono + tRPC + Better Auth
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: omniheaven-api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-omniheaven}:${POSTGRES_PASSWORD:-omniheaven_secret_pass}@postgres:5432/${POSTGRES_DB:-omniheaven_prod}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-omniheaven_auth_secret_key_32chars_min}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: omniheaven-assets
      PAYSTATION_MERCHANT_ID: ${PAYSTATION_MERCHANT_ID:-}
      PAYSTATION_API_KEY: ${PAYSTATION_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - omniheaven-net

  # =========================================================================
  # 4. ADMIN DASHBOARD & WEBSITE BUILDER STUDIO: Next.js 16 (Port 3000)
  # =========================================================================
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_NAME: admin
    container_name: omniheaven-admin
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - omniheaven-net

  # =========================================================================
  # 5. HOTEL & RESORT CUSTOMER WEB ENGINE: Next.js 16 (Port 3003)
  # =========================================================================
  hotel-resort-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_NAME: hotel-resort-web
    container_name: omniheaven-hotel-resort-web
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3003:3003"
    depends_on:
      - api
    networks:
      - omniheaven-net

  # =========================================================================
  # 6. RENTER RESIDENTIAL PORTAL: Next.js 16 (Port 3002)
  # =========================================================================
  renter-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_NAME: renter-portal
    container_name: omniheaven-renter-portal
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - omniheaven-net

  # =========================================================================
  # 7. SUPERADMIN HQ DASHBOARD: Next.js 16 (Port 3001)
  # =========================================================================
  superadmin:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_NAME: superadmin
    container_name: omniheaven-superadmin
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - omniheaven-net

  # =========================================================================
  # 8. COMMERCIAL LANDING PAGE: Next.js 16 (Port 3004)
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_NAME: web
    container_name: omniheaven-web
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: production
    ports:
      - "3004:3004"
    networks:
      - omniheaven-net

  # =========================================================================
  # 9. CLOUDFLARE TUNNEL (Zero Trust ingress for *.omniheaven.com)
  # =========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omniheaven-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - omniheaven-net
    profiles:
      - tunnel

  # =========================================================================
  # 10. OBSERVABILITY STACK: Loki + Promtail + Prometheus + Tempo + Grafana
  # Run with: docker compose --profile observability up -d
  # =========================================================================
  loki:
    image: grafana/loki:3.0.0
    container_name: omniheaven-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    networks:
      - omniheaven-net
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.0.0
    container_name: omniheaven-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - omniheaven-net
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: omniheaven-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - omniheaven-net
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.4.1
    container_name: omniheaven-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo.yml
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - omniheaven-net
    profiles:
      - observability

  grafana:
    image: grafana/grafana:10.4.2
    container_name: omniheaven-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-omniheaven_grafana_pass}
      GF_USERS_ALLOW_SIGN_UP: false
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3105:3000" # Mapped to 3105 to avoid collision with admin dashboard on port 3000
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - omniheaven-net
    profiles:
      - observability

  # =========================================================================
  # 11. PRIVACY-FIRST ANALYTICS: Plausible Community Edition
  # Run with: docker compose --profile analytics up -d
  # =========================================================================
  plausible_db:
    image: postgres:16-alpine
    container_name: omniheaven-plausible-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAUSIBLE_DB_USER:-plausible}
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD:-plausible_secret_pass}
      POSTGRES_DB: ${PLAUSIBLE_DB_NAME:-plausible}
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    networks:
      - omniheaven-net
    profiles:
      - analytics

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: omniheaven-plausible-events
    restart: unless-stopped
    volumes:
      - plausible_events_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - omniheaven-net
    profiles:
      - analytics

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.4
    container_name: omniheaven-plausible
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_events_db
    environment:
      BASE_URL: ${PLAUSIBLE_BASE_URL:-http://localhost:8000}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE:-omniheaven_random_secret_key_base_64_chars_min_for_plausible_prod}
      DATABASE_URL: postgresql://${PLAUSIBLE_DB_USER:-plausible}:${PLAUSIBLE_DB_PASSWORD:-plausible_secret_pass}@plausible_db:5432/${PLAUSIBLE_DB_NAME:-plausible}
      CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
    ports:
      - "8000:8000"
    networks:
      - omniheaven-net
    profiles:
      - analytics

networks:
  omniheaven-net:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  seaweedfs_data:
  loki_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  plausible_db_data:
  plausible_events_data:

